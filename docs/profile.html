<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | CP Tracker</title>

    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/profile.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
    <div id="navbar"></div>
    <!-- Cover -->
    <section class="cover">
        <div class="cover-overlay">
            <div class="profile-header">
                <div class="profile-image">
                    <img src="images/default-profile.png" id="profileImage">
                    <input type="file" id="profileUpload" hidden>
                    <button onclick="uploadPhoto()" id="changePhoto">Change Photo</button>
                    <!-- <button ></button> -->
                </div>
                <div class="profile-details">
                    <h1 id="fullname">Loading...</h1>
                    <h3 id="username">@username</h3>
                    <p id="bioText">Competitive Programmer</p>
                    <div class="profile-meta">
                        <span id="country"> 🌍 Bangladesh</span>
                        <span id="joined">Joined Aug 2026</span>
                    </div>
                </div>

                <div class="profile-action">
                    <button id="editBtn">Edit Profile</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Main -->

    <main class="container">
        <!-- Left -->
        <div class="left-column">
            <div class="card">
                <h2>Personal Information</h2>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullNameInput">
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="usernameInput" readonly>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="emailInput" readonly>
                </div>

                <div class="form-group">
                    <label>Country</label>
                    <input type="text" id="countryInput">
                </div>

                <div class="form-group">
                    <label>Institution</label>
                    <input type="text" id="institutionInput">
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="bioInput" rows="5"></textarea>
                </div>
            </div>
        </div>

        <!-- Right -->

        <div class="right-column">
            <div class="card">
                <h2>Connected Accounts</h2>
                <!-- CF -->
                <div class="platform">
                    <div>
                        <h3>Codeforces</h3>
                        <input type="text" id="cf" placeholder="Handle">
                    </div>
                    <button class="verify">Verify</button>
                </div>
                <!-- CC -->
                <div class="platform">
                    <div>
                        <h3>CodeChef</h3>
                        <input type="text" id="cc" placeholder="Handle">
                    </div>
                    <button class="verify">Verify</button>
                </div>
                <!-- AC -->
                <div class="platform">
                    <div>
                        <h3>AtCoder</h3>
                        <input type="text" id="ac" placeholder="Handle">
                    </div>
                    <button class="verify">Verify</button>
                </div>
            </div>

            <div class="card">
                <h2>Statistics</h2>
                <div class="stats">
                    <div class="stat">
                        <h1 id="solved">0</h1>
                        <span>Problems</span>
                    </div>
                    <div class="stat">
                        <h1 id="rating">--</h1>
                        <span>Rating</span>
                    </div>
                    <div class="stat">
                        <h1 id="maxRating">--</h1>
                        <span>Max Rating</span>
                    </div>
                    <div class="stat">
                        <h1 id="contest">0</h1>
                        <span>Contests</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Buttons -->

    <section class="save-section">
        <button id="cancelBtn" class="cancel"> Cancel </button>
        <button id="saveBtn" class="save">
            Save Changes
        </button>

    </section>

    <script src="js/nav.js"></script>
    <script src="js/profile.js"></script>

</body>

</html>
