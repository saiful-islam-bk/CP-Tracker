<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CP Tracker</title>

    <link rel="stylesheet" href="css/reg.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>


    <div id="navbar"></div>
    <script src="js/nav.js"></script>

    <script type="module" src="js/reg.js"></script>

    <div class="container">

        <div class="left">

            <h1>CP Tracker</h1>

            <h2>Start Your<br>Competitive<br>Programming Journey.</h2>

            <p>
                Create your account and track your progress across Codeforces,
                CodeChef and AtCoder.
            </p>

            <div class="platforms">
                <span>Codeforces</span>
                <span>CodeChef</span>
                <span>AtCoder</span>
            </div>

        </div>

        <div class="right">

            <div class="register-box">

                <h2>Create Account</h2>

                <p>Join CP Tracker today</p>

                <form id="regform">

                    <label>Full Name</label>
                    <input type="text" id="fullname" placeholder="Enter your full name" required>

                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                    
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                    
                    <label>Country</label>
                    <input type="text" id="country" placeholder="Enter your Country">

                    <label>Institution</label>
                    <input type="text" id="institution" placeholder="Enter your Institution Name">

                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>

                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>

                    <button type="submit" id="create_account">
                        Create Account
                    </button>

                </form>

                <div class="bottom">
                    Already have an account?
                    <a href="login.html">Login</a>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
